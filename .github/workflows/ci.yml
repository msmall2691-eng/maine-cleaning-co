name: CI

on:
  push:
    branches: [main]
  # Deliberately unfiltered: a pull request gets CI whatever branch it targets.
  #
  # This used to be `branches: [main]`, which meant a PR stacked on another
  # PR's branch got no CI at all — not a red check, no check runs whatsoever,
  # so the PR page showed nothing rather than showing a problem. PR #76 was
  # opened against a feature branch and sat unverified until someone noticed
  # the absence. Stacking is the normal way to split a large change into
  # reviewable pieces, and the piece that most needs checking is the one
  # building on unmerged work.
  #
  # `push` keeps its filter. Without it every push to every branch would
  # duplicate the run its own pull request already triggers.
  pull_request:

jobs:
  test:
    name: test + build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # setup-node honours the full x.y.z in .nvmrc, so this is CI's exact
          # Node. Production's exact Node is the Dockerfile's base image, and
          # server/__tests__/esmNodeCompat.test.ts fails if the two disagree.
          # They are separate files because nothing reads both: Railway's old
          # nixpacks builder read .nvmrc but rounded it to the major, which is
          # how CI ended up on 20.19.5 while production ran 20.18.1.
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Vitest
        run: npm test

      - name: Build (client + server bundle)
        run: npm run build
