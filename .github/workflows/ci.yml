name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: test + build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Read from .nvmrc, which Railway's builder reads too. Pinning the
          # version here instead let CI and production drift onto different
          # majors — see .nvmrc.
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Vitest
        run: npm test

      - name: Build (client + server bundle)
        run: npm run build
