<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Dropped maximum-scale=1: it disables pinch-zoom, which is an
         accessibility regression on iOS (WCAG SC 1.4.4). viewport-fit=cover
         lets notched iPhones extend the viewport under the status bar. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Tint the mobile browser chrome to match the site's light/dark backgrounds
         so the iOS status bar / Android URL bar blends with the page. Values
         match --background in index.css. -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#fbfbfa" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#141821" />
    <!-- Stop iOS Safari from auto-linkifying prices ($240), dates (Jul 8),
         and ZIP codes as tel: links, which broke copy behavior on estimate
         summaries. address=no also prevents Maps deep-links on street text. -->
    <meta name="format-detection" content="telephone=no, address=no, email=no, date=no" />
    <!-- Add-to-Home-Screen: launch full-screen. `default` gives dark status-bar
         text, which is what the light theme the site boots into needs. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Smallworks" />
    <link rel="apple-touch-icon" sizes="512x512" href="/apple-touch-icon.png" />
    <meta name="description" content="Operations software for local service businesses. Instant quoting, lead intake, booking, a client portal and an operator dashboard — built by someone who ran one." />
    <meta name="robots" content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1" />
    <!-- The canonical host. Keep this, og:url, the JSON-LD @id/url and
         CANONICAL_ORIGIN in server/lib/sitemap.ts on the SAME host the app is
         actually deployed to, or every page asks to be indexed somewhere it
         is not served. client/src/lib/brand.ts holds the copy the app reads at
         runtime; these tags are read before JavaScript runs, which is the only
         reason the value is duplicated here. -->
    <link rel="canonical" href="https://www.smallworks.systems/" />

    <meta property="og:title" content="Smallworks | Operations software for local service businesses" />

    <meta name="twitter:description" content="I spent seven years running a cleaning company and built the software that ran it. Now I build that same system — quoting, intake, booking, portal, dashboard — for other local service businesses." />
    <meta name="twitter:image" content="https://www.smallworks.systems/opengraph.jpg" />

    <!-- Google Analytics 4 -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-T476Q8GYS5"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-T476Q8GYS5');

    <title>Smallworks | Operations software for local service businesses</title>
    <!-- SVG first so the mark stays sharp on hi-dpi tabs; the PNG is the
         fallback for browsers that still refuse SVG favicons. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="180x180" href="/favicon.png" />

    <script>
      /* Paint the stored theme before first paint, so there is no flash.
         The fallback MUST match readInitialTheme() in src/lib/theme.tsx —
         both default to light. They disagreed before this: the inline script
         defaulted to dark and the React provider to light, so every first
         visit painted the whole page dark and then snapped to light as soon
         as React mounted. If you change the default, change it in BOTH. */
      (function () {
        var theme = 'light';
        try {
          var stored = localStorage.getItem('mcc-theme');
          if (stored === 'light' || stored === 'dark') theme = stored;
        } catch (e) {
          /* private mode / storage disabled — keep the default */
        }
        if (theme === 'dark') document.documentElement.classList.add('dark');
        document.documentElement.style.colorScheme = theme;
      })();
    </script>
