<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <title>The Maine Cleaning Co.</title>
  <!-- Matches components/brand/Logo.tsx <LighthouseBeacon>. Keep the two in step.
       This is the `minimal` cut of it: the spruce treeline, keeper's house,
       gallery railing, glazing bars and water all come out, because at the 16px
       a browser tab actually renders they are sub-pixel and only muddy the
       silhouette. What survives is the read that matters — a white tower under
       a lit lantern, standing on granite.

       A plate rather than a bare glyph: tabs, bookmark bars and the iOS home
       screen composite the icon onto an unknown background, and the navy is
       what keeps the white tower readable on any of them. -->
  <defs>
    <linearGradient id="plate" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1b2b4a"/>
      <stop offset="100%" stop-color="#0c1424"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff0c9" stop-opacity="0.95"/>
      <stop offset="32%" stop-color="#ffd98a" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#f6c667" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tower" x1="10%" y1="0%" x2="100%" y2="60%">
      <stop offset="0%" stop-color="#fbf8f0"/>
      <stop offset="52%" stop-color="#ddd7c8"/>
      <stop offset="100%" stop-color="#8d94a3"/>
    </linearGradient>
    <clipPath id="clip">
      <rect x="0" y="0" width="120" height="120" rx="27"/>
    </clipPath>
  </defs>

  <g clip-path="url(#clip)">
    <rect width="120" height="120" fill="url(#plate)"/>
    <g transform="translate(11 13) scale(0.82)">
      <circle cx="60" cy="31" r="31" fill="url(#glow)"/>

      <!-- tower -->
      <path d="M46 90 L53 44 L67 44 L74 90 Z" fill="url(#tower)"/>
      <!-- gallery deck -->
      <path d="M49 44 L71 44 L73 39 L47 39 Z" fill="#0a1120"/>
      <!-- lantern room, lit -->
      <rect x="52" y="20" width="16" height="14" fill="#ffe9b4"/>
      <!-- domed cap and finial -->
      <path d="M50 20 Q60 8 70 20 Z" fill="#0a1120"/>
      <circle cx="60" cy="8" r="2.4" fill="#0a1120"/>
      <rect x="59.2" y="4" width="1.6" height="4" fill="#0a1120"/>

      <!-- granite, lit on the top faces -->
      <path d="M30 90 L40 84 L54 88 L58 96 L28 96 Z" fill="#4e5a6b"/>
      <path d="M30 90 L40 84 L54 88 L48 90 L36 88 Z" fill="#949cab"/>
      <path d="M58 88 L70 83 L86 88 L92 96 L56 96 Z" fill="#46525f"/>
      <path d="M58 88 L70 83 L86 88 L76 90 L64 89 Z" fill="#878f9d"/>
    </g>
  </g>
</svg>
